# 由现有 1Panel OpenResty 终止 HTTPS；应用端口仅绑定服务器回环地址。
limit_req_zone $binary_remote_addr zone=oxide_web:10m rate=20r/s;
server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/example.com/acme;
        default_type text/plain;
    }
    location / { return 308 https://example.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;
    ssl_certificate /www/sites/example.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/example.com/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:oxide_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    autoindex off;
    client_max_body_size 20m;
    access_log /www/sites/example.com/log/access.log main;
    error_log /www/sites/example.com/log/error.log warn;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; object-src 'none'; base-uri 'self'" always;
    location ~ /\. { return 404; }
    location ~* \.(env|ini|conf|log|bak|old|orig|swp|sql|ya?ml|zip|tar|tgz)$ { return 404; }
    location ~ ~$ { return 404; }
    location / {
        limit_req zone=oxide_web burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
